name = "grabit"
main = "src/worker/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
# 保留在 Cloudflare 後台設定的變數（ACCESS_TEAM_DOMAIN、ACCESS_AUD、ADMIN_EMAILS），部署時不會被清掉
keep_vars = true

[vars]
# 日期變數（{yyyy}/{MM}/{dd}）使用的時區
TIMEZONE = "Asia/Taipei"
# Cloudflare Access 與管理員 email 請在 Cloudflare 後台 Worker 的「Variables and Secrets」設定：
#   ACCESS_TEAM_DOMAIN、ACCESS_AUD、ADMIN_EMAILS（逗號分隔；沒設定時第一位登入者成為管理員）
# AI 模型（需要 ANTHROPIC_API_KEY）
AI_MODEL = "claude-opus-5-5"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/webhook", "/oauth/*"]

[[d1_databases]]
binding = "DB"
database_name = "grabit"
# 執行 `npx wrangler d1 create grabit` 後，把輸出的 database_id 貼到這裡
database_id = "365690e0-a926-4160-a81f-84294c0b82b9"
migrations_dir = "migrations"

# 每 5 分鐘把失敗或卡住的檔案撿回來重試（免費方案可用）
[triggers]
crons = ["*/5 * * * *"]

# ---------- 選用：Cloudflare Queues（需要 Workers Paid 方案） ----------
# 有 Queues 時，收到的檔案改由佇列處理，重試更即時。建立 grabit-files 佇列後取消下面的註解。
# [[queues.producers]]
# binding = "FILE_QUEUE"
# queue = "grabit-files"
#
# [[queues.consumers]]
# queue = "grabit-files"
# max_batch_size = 5
# max_batch_timeout = 5
# max_retries = 6
# # 一次只跑一個 consumer，避免同時建立重複的雲端資料夾
# max_concurrency = 1

[observability]
enabled = true

# ---------- 選用：語意搜尋（Workers AI + Vectorize） ----------
# npx wrangler vectorize create grabit-files --dimensions=1024 --metric=cosine
# [ai]
# binding = "AI"
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "grabit-files"
